name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fleetdeck_test
          POSTGRES_USER: fleetdeck
          POSTGRES_PASSWORD: ci_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U fleetdeck'
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://fleetdeck:ci_only_password@127.0.0.1:5432/fleetdeck_test
      FLEETDECK_TEST_URL: postgres://fleetdeck:ci_only_password@127.0.0.1:5432/fleetdeck_test
      INGEST_KEY: ci_only_gateway_secret_not_for_deployment
      DEMO_MODE: 'true'
      DEMO_ACCESS: admin
      PUBLIC_ORIGIN: http://127.0.0.1:3080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: python -m pip install -r ml/requirements.txt
      - run: npm run eta:reproduce
      - run: npm run format:check
      - run: npm run test:integration
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build -t fleetdeck:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
